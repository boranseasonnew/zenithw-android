name: Android feature candidate (no publication)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/**'
      - 'scripts/**'
      - '**.gradle.kts'
      - '.github/workflows/android-candidate.yml'
permissions:
  contents: read
concurrency:
  group: android-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [24, 33]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 scripts/package_native_curl.py --cache-dir .cache/native-curl
      - run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PtestBuildType=debug assembleDebug assembleDebugAndroidTest lintDebug
          python3 tests/run_jvm_checks.py "$HOME/.gradle"
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          script: ./gradlew --no-daemon -PtestBuildType=debug connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=space.zenithw.app.FeatureReleaseTest,space.zenithw.app.MetadataOptimizationTest,space.zenithw.app.DownloadRegressionTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-preview-api${{ matrix.api }}
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/outputs/androidTest-results/
          retention-days: 7
