name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and attach APKs to, for example v2.0.0"
        required: true
        type: string
      publish_release:
        description: "Publish verified APKs; disable to only build and upload test artifacts"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require the existing Android signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Add the existing Android signing key as the ANDROID_SIGNING_KEY_BASE64 repository secret. No new key will be generated."
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$SIGNING_KEY" | base64 --decode > .signing/preview.keystore
          chmod 600 .signing/preview.keystore

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set version from release tag
        env:
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ["TAG_NAME"]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if not match:
              raise SystemExit(f"Expected a version tag like v2.0.0, got {tag}")
          major, minor, patch = map(int, match.groups())
          version_code = major * 1_000_000 + minor * 1_000 + patch
          if version_code > 2_100_000_000:
              raise SystemExit("Version is too large for Android versionCode")
          gradle_file = Path("app/build.gradle.kts")
          text = gradle_file.read_text()
          text, code_count = re.subn(r"versionCode\s*=\s*\d+", f"versionCode = {version_code}", text, count=1)
          text, name_count = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{major}.{minor}.{patch}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update Android version values")
          gradle_file.write_text(text)
          PY

      - name: Build signed ABI APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test updates and saved settings on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: bash scripts/android_smoke.sh

      - name: Upload Android test results and screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-13-smoke-results
          path: smoke-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify and prepare signed release files
        env:
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 scripts/prepare_release.py --version "${TAG_NAME#v}" \
            --build-tools "$ANDROID_HOME/build-tools/36.0.0"

      - name: Upload verified APK build artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_release
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-apks
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

      - name: Upload APKs and publish the GitHub Release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.apk release-assets/SHA256SUMS.txt --clobber
            IS_DRAFT="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" = "true" ]; then
              gh release edit "$TAG_NAME" --draft=false
            fi
          else
            gh release create "$TAG_NAME" release-assets/*.apk release-assets/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Zenith Android ${TAG_NAME#v}" --generate-notes
          fi
