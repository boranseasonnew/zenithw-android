name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build and attach APKs to, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require the existing Android signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Add the existing Android signing key as the ANDROID_SIGNING_KEY_BASE64 repository secret. No new key will be generated."
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$SIGNING_KEY" | base64 --decode > .signing/preview.keystore
          chmod 600 .signing/preview.keystore

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set version from release tag
        env:
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ["TAG_NAME"]
          match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", tag)
          if not match:
              raise SystemExit(f"Expected a version tag like v2.0.0, got {tag}")
          major, minor, patch = map(int, match.groups())
          version_code = major * 1_000_000 + minor * 1_000 + patch
          if version_code > 2_100_000_000:
              raise SystemExit("Version is too large for Android versionCode")
          gradle_file = Path("app/build.gradle.kts")
          text = gradle_file.read_text()
          text, code_count = re.subn(r"versionCode\s*=\s*\d+", f"versionCode = {version_code}", text, count=1)
          text, name_count = re.subn(r'versionName\s*=\s*"[^"]+"', f'versionName = "{major}.{minor}.{patch}"', text, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not update Android version values")
          gradle_file.write_text(text)
          PY

      - name: Build signed ABI APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Prepare release files
        env:
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          OUT="release-assets"
          mkdir -p "$OUT"
          VERSION="$VERSION" python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path

          root = Path("app/build/outputs/apk")
          wanted = {"arm64-v8a", "armeabi-v7a", "x86_64"}
          found = {}
          for metadata in root.rglob("output-metadata.json"):
              try:
                  data = json.loads(metadata.read_text())
              except (OSError, json.JSONDecodeError):
                  continue
              for element in data.get("elements", []):
                  abi = next((item.get("value") for item in element.get("filters", [])
                              if item.get("filterType") == "ABI"), None)
                  output = metadata.parent / element.get("outputFile", "")
                  if abi in wanted and output.is_file():
                      found[abi] = output

          for abi in wanted:
              if abi not in found:
                  for output in root.rglob("*.apk"):
                      if abi in output.name:
                          found[abi] = output
                          break

          missing = wanted - found.keys()
          if missing:
              actual = ", ".join(str(path) for path in root.rglob("*.apk")) or "(no APK files found)"
              raise SystemExit(f"Missing ABI APKs {sorted(missing)}. Actual outputs: {actual}")

          out = Path("release-assets")
          version = os.environ["VERSION"]
          for abi, source in found.items():
              shutil.copy2(source, out / f"Zenith-{version}-stable-{abi}.apk")
              print(f"Prepared {abi}: {source}")
          PY
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload APKs and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/*.apk release-assets/SHA256SUMS.txt --clobber
            IS_DRAFT="$(gh release view "$TAG_NAME" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" = "true" ]; then
              gh release edit "$TAG_NAME" --draft=false
            fi
          else
            gh release create "$TAG_NAME" release-assets/*.apk release-assets/SHA256SUMS.txt \
              --title "Zenith Android ${TAG_NAME#v}" --generate-notes
          fi
